<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101513">
  <title>Timelapse archive</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <!-- Optional MSE player: hls.js is preferred, with native HLS as fallback. -->
  <script async src="vendor/hls.min.js" onload="window.timelapseHlsSettled=1;window.dispatchEvent(new Event('hls-ready'))" onerror="window.timelapseHlsSettled=1;window.dispatchEvent(new Event('hls-ready'))"></script>
  <script src="app.js"></script>
</body>
</html>
